[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "rsm_nvidia_hackathon"
version = "0.0.1"
description = "Our proposed solution aims to enhance the visibility of public submissions related to the Australian Government's recent consultation on the safe and responsible use of AI in high-risk settings. We will leverage Generative AI to transform unstructured data from public responses into structured insights, thereby facilitating greater transparency and understanding."
authors = [
  { name = "RSM" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known_first_party = ["rsm_nvidia_hackathon"]
force_sort_within_sections = true
